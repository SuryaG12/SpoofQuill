<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishLens</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #1f2933;
            --muted: #5f6b7a;
            --line: #d9dee5;
            --page: #f3f5f8;
            --card: #ffffff;
            --accent: #1a56db;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 32px 16px;
            background: var(--page);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }
        main {
            max-width: 860px;
            margin: 0 auto;
        }
        h1 { margin: 0 0 4px; font-size: 1.8rem; }
        .tagline { margin: 0 0 24px; color: var(--muted); }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        textarea {
            width: 100%;
            min-height: 220px;
            resize: vertical;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
            font-size: 0.85rem;
            color: var(--ink);
            background: #fbfcfd;
        }
        textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 12px;
        }
        button {
            font: inherit;
            padding: 9px 16px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
            cursor: pointer;
        }
        button:hover { border-color: #aab4c0; }
        button:disabled { opacity: 0.55; cursor: progress; }
        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        button.primary:hover { background: #1546b8; }
        .spacer { flex: 1 1 auto; }
        .hint { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; }
        .status {
            min-height: 1.5em;
            margin: 12px 0 0;
            font-size: 0.9rem;
            color: var(--muted);
        }
        .status.error { color: #b42318; }
        .result-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 12px;
        }
        .score {
            font-size: 2.6rem;
            font-weight: 700;
            line-height: 1;
        }
        .score small { font-size: 1rem; color: var(--muted); font-weight: 500; }
        .badge {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .badge.low { background: #e7f6ec; color: #12633a; }
        .badge.medium { background: #fff3d6; color: #7a4b00; }
        .badge.high { background: #fde8e6; color: #9b1c12; }
        h2 { font-size: 1rem; margin: 24px 0 8px; }
        ul { margin: 0; padding-left: 20px; }
        li { margin-bottom: 6px; }
        dl {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 6px 16px;
            margin: 0;
        }
        dt { color: var(--muted); }
        dd { margin: 0; overflow-wrap: anywhere; }
        .links li { margin-bottom: 10px; }
        .link-url {
            display: block;
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
            font-size: 0.85rem;
            color: var(--muted);
            overflow-wrap: anywhere;
        }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <h1>PhishLens</h1>
        <p class="tagline">Paste a raw email and see how many phishing warning signs it shows.</p>

        <section class="card">
            <label for="email-input">Raw email</label>
            <textarea id="email-input" placeholder="Paste the full email here, headers and all..."></textarea>
            <div class="actions">
                <button type="button" data-example="1">Load example 1</button>
                <button type="button" data-example="2">Load example 2</button>
                <button type="button" data-example="3">Load example 3</button>
                <span class="spacer"></span>
                <button type="button" id="analyze" class="primary">Analyze</button>
            </div>
            <p class="status" id="status" role="status" aria-live="polite"></p>
        </section>

        <section class="card" id="result" hidden>
            <div class="result-header">
                <span class="score"><span id="score">-</span><small> / 100</small></span>
                <span class="badge" id="badge"></span>
            </div>

            <h2>Why</h2>
            <ul id="reasons"></ul>

            <h2>Sender</h2>
            <dl>
                <dt>From</dt><dd id="sender"></dd>
                <dt>Domain</dt><dd id="sender-domain"></dd>
                <dt>Reply-to</dt><dd id="reply-to"></dd>
            </dl>

            <h2>Links</h2>
            <ul class="links" id="links"></ul>
        </section>
    </main>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        const EXAMPLES = {
            1: `${API_BASE}/examples/example1.txt`,
            2: `${API_BASE}/examples/example2.txt`,
            3: `${API_BASE}/examples/example3.txt`,
        };

        const input = document.getElementById("email-input");
        const analyzeButton = document.getElementById("analyze");
        const status = document.getElementById("status");
        const result = document.getElementById("result");

        function setStatus(message, isError = false) {
            status.textContent = message;
            status.classList.toggle("error", isError);
        }

        function setBusy(busy) {
            analyzeButton.disabled = busy;
            analyzeButton.textContent = busy ? "Analyzing..." : "Analyze";
        }

        function text(value) {
            if (value === null || value === undefined || value === "") return "—";
            return String(value);
        }

        function riskLabel(score) {
            if (score >= 60) return { label: "High risk", className: "high" };
            if (score >= 30) return { label: "Suspicious", className: "medium" };
            return { label: "Low risk", className: "low" };
        }

        function render(data) {
            document.getElementById("score").textContent = data.score;

            const risk = riskLabel(data.score);
            const badge = document.getElementById("badge");
            badge.textContent = risk.label;
            badge.className = `badge ${risk.className}`;

            const reasons = document.getElementById("reasons");
            reasons.replaceChildren();
            if (!data.reasons.length) {
                const item = document.createElement("li");
                item.textContent = "No warning signs found.";
                reasons.append(item);
            }
            for (const reason of data.reasons) {
                const item = document.createElement("li");
                item.textContent = reason;
                reasons.append(item);
            }

            document.getElementById("sender").textContent = text(data.sender);
            document.getElementById("sender-domain").textContent = text(data.sender_domain);
            document.getElementById("reply-to").textContent = text(data.reply_to);

            const links = document.getElementById("links");
            links.replaceChildren();
            if (!data.links.length) {
                const item = document.createElement("li");
                item.textContent = "No links found.";
                links.append(item);
            }
            for (const link of data.links) {
                const item = document.createElement("li");
                const anchor = document.createElement("a");
                anchor.href = link.url;
                anchor.textContent = link.text || link.url;
                anchor.target = "_blank";
                anchor.rel = "noopener noreferrer";
                item.append(anchor);
                // Show the real target too when the visible text is something else.
                if (link.text && link.text !== link.url) {
                    const url = document.createElement("span");
                    url.className = "link-url";
                    url.textContent = link.url;
                    item.append(url);
                }
                links.append(item);
            }

            result.hidden = false;
            result.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        async function loadExample(number) {
            setStatus(`Loading example ${number}...`);
            try {
                const response = await fetch(EXAMPLES[number]);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                input.value = await response.text();
                result.hidden = true;
                setStatus(`Loaded example ${number}. Click Analyze.`);
            } catch (error) {
                setStatus(
                    `Could not load example ${number} (${error.message}). ` +
                        "The API server must be running on 127.0.0.1:8000.",
                    true
                );
            }
        }

        async function analyze() {
            const rawEmail = input.value;
            if (!rawEmail.trim()) {
                setStatus("Paste an email first, or load one of the examples.", true);
                return;
            }

            setBusy(true);
            setStatus("Analyzing...");
            try {
                const response = await fetch(`${API_BASE}/analyze`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ raw_email: rawEmail }),
                });

                if (!response.ok) {
                    let detail = `HTTP ${response.status}`;
                    try {
                        const body = await response.json();
                        if (body.detail) detail = JSON.stringify(body.detail);
                    } catch {
                        /* response was not JSON */
                    }
                    throw new Error(detail);
                }

                const data = await response.json();
                render(data);
                setStatus(`Scored ${data.score}/100.`);
            } catch (error) {
                setStatus(
                    `Analysis failed (${error.message}). ` +
                        "Check that the API is running on 127.0.0.1:8000.",
                    true
                );
            } finally {
                setBusy(false);
            }
        }

        for (const button of document.querySelectorAll("[data-example]")) {
            button.addEventListener("click", () => loadExample(button.dataset.example));
        }
        analyzeButton.addEventListener("click", analyze);
    </script>
</body>
</html>
